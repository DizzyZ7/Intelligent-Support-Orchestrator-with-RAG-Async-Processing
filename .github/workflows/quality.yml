name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m compileall -q app tests
      - name: Run dependency-free regression tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests

  dependency-and-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: python -m pip install 'poetry==1.7.1'
      - name: Resolve and install application dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi --no-root
      - name: Validate application imports with placeholder credentials
        env:
          OPENAI_API_KEY: ci-placeholder
          ZENDESK_API_TOKEN: ci-placeholder
          ZENDESK_SUBDOMAIN: ci-placeholder
          ZENDESK_EMAIL: ci@example.invalid
          WEBHOOK_SECRET: ci-placeholder-secret
        run: |
          python -c 'from app.api.routes import app; from app.worker.tasks import process_ticket_task; print(app.title, process_ticket_task.name)'
      - name: Validate Docker Compose
        env:
          OPENAI_API_KEY: ci-placeholder
          ZENDESK_API_TOKEN: ci-placeholder
          ZENDESK_SUBDOMAIN: ci-placeholder
          ZENDESK_EMAIL: ci@example.invalid
          WEBHOOK_SECRET: ci-placeholder-secret
        run: |
          cp .env.example .env
          docker compose config --quiet
